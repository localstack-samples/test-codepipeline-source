name: Run the source through a pipeline

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Build and deploy through CodePipeline
    # The pipeline pulls the branch from this repository, so it cannot test branches in forks
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # LocalStack stops tracking a build whose image is still downloading,
      # so pull the CodeBuild images (about 17 GB) before starting the pipeline
      - name: Pull the CodeBuild images
        run: |
          # Anonymous ECR Public pulls are rate limited per IP, which runners share
          for image in public.ecr.aws/codebuild/amazonlinux-x86_64-standard:5.0 localstack/aws-codebuild-local:2; do
            for attempt in 1 2 3 4 5; do
              docker pull -q "$image" && break
              [ "$attempt" = 5 ] && exit 1
              echo "Pull of $image failed, retrying in 60s"
              sleep 60
            done
          done

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk
        run: |
          npm install -g @localstack/lstk
          lstk setup aws --force --non-interactive

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          # Forwarded as CODEPIPELINE_GH_TOKEN, used to download the source archive from GitHub
          LOCALSTACK_CODEPIPELINE_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lstk start

      - name: Run the pipeline
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          MAX_WAIT_SECONDS: 1200
        run: ./test.sh

      - name: Show pipeline state and LocalStack logs
        if: failure()
        run: |
          lstk aws codepipeline get-pipeline-state --name source-pipeline || true
          lstk aws codepipeline list-action-executions --pipeline-name source-pipeline || true
          builds=$(lstk aws codebuild list-builds --query 'ids' --output text || true)
          [ -n "$builds" ] && lstk aws codebuild batch-get-builds --ids $builds \
            --query 'builds[].{id: id, status: buildStatus, phases: phases[].[phaseType, phaseStatus, contexts[0].message]}' || true
          lstk aws cloudformation describe-stack-events --stack-name source-pipeline-stack || true
          docker ps -a
          lstk logs | grep -vE 'ListPipelineExecutions|ListActionExecutions' | tail -400
